<head>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background-color: #374151;
            color: #ffffff;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            padding: 3rem 0 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            text-align: center;
            margin: 0 0 0.5rem;
        }
        .subtitle {
            font-size: 0.875rem;
            font-weight: 600;
            text-align: center;
            margin: 0 0 3rem;
        }
        .album-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        @media (min-width: 640px) {
            .album-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (min-width: 768px) {
            .album-grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (min-width: 1024px) {
            .album-grid { grid-template-columns: repeat(6, 1fr); }
        }
        .album-cover {
            aspect-ratio: 1 / 1;
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .album-cover:hover,
        .album-cover:focus-within {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            z-index: 10;
            position: relative;
        }
        .album-cover a {
            display: block;
            width: 100%;
            height: 100%;
        }
        .album-cover a:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 2px;
        }
        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .footer {
            margin-top: 4rem;
            padding: 2rem 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(17, 24, 39, 0.8);
            text-align: center;
        }
        .footer img {
            max-width: 20rem;
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>The Albums of The Tabernacle Choir</h1>
        <p class="subtitle">Recorded while Melinda Baros served from 2013 - 2029</p>

        <div id="album-grid" class="album-grid">
            <!-- Albums are rendered here by the script below -->
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <img src="album-covers/tab-choir.jpg" alt="The Tabernacle Choir at Temple Square">
        </div>
    </footer>

        function createAlbumElement(album) {
            const albumDiv = document.createElement('div');
            albumDiv.className = 'album-cover';

            const link = document.createElement('a');
            link.href = album.url;
            link.target = '_blank';
            link.rel = 'noopener';
            link.title = album.title;

            const img = document.createElement('img');
            img.src = album.artwork;
            img.alt = album.title;
            img.loading = 'lazy';

            link.appendChild(img);
            albumDiv.appendChild(link);
            return albumDiv;
        }

        const albumGrid = document.getElementById('album-grid');
        albums.forEach(album => albumGrid.appendChild(createAlbumElement(album)));

</html>
